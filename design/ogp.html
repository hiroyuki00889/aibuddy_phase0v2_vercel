<!doctype html>
<!-- OGP画像の元データ。Chromeのヘッドレスモードで1200x630のPNGに書き出し、web/ogp.png に置く -->
<html lang="ja">
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
    padding: 0 90px;
    background: linear-gradient(180deg, #f4efe8 0%, #efe6dc 100%);
    color: #1f2328;
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", system-ui, sans-serif;
    text-align: center;
  }
  .eyebrow {
    margin: 0 0 40px;
    padding: 8px 28px;
    border-radius: 999px;
    background: rgba(196, 140, 80, 0.15);
    color: #8a5a2b;
    font-size: 30px;
    font-weight: 600;
  }
  .title {
    margin: 0 0 48px;
    font-size: 68px;
    font-weight: 700;
    line-height: 1.45;
  }
  .name {
    margin: 0;
    font-size: 44px;
    font-weight: 700;
  }
</style>
</head>
<body>
  <p class="eyebrow">対等に話せるAIの相棒</p>
  <h1 class="title">話していると、<br />誰かと一緒にいる感じがする。</h1>
  <p class="name">mybo！</p>
</body>
</html>
